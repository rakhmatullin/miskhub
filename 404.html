<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiskHub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b14;
        color: #94a3b8;
        font-family: system-ui, sans-serif;
      }
    </style>
    <script>
      (function () {
        var map = { ustranenie: "ustranenie.html", "sverka-vesov": "sverka-vesov.html" };
        var parts = location.pathname.replace(/\/+$/, "").split("/");
        var last = parts[parts.length - 1] || "";
        if (last && last !== "miskhub" && map[last]) {
          location.replace("/miskhub/" + map[last] + location.search + location.hash);
          return;
        }
        location.replace("/miskhub/" + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Загрузка MiskHub…</p>
  </body>
</html>
