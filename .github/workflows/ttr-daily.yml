name: Акт ТТР

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto — по расписанию, now — отправить сейчас, resend — отправить повторно"
        type: string
        default: now
      date:
        description: "Дата YYYY-MM-DD. Пусто — сегодня по Москве."
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ttr-daily
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/ttr/package-lock.json
      - run: npm ci
        working-directory: tools/ttr
      - run: node send.mjs
        working-directory: tools/ttr
        env:
          TTR_MAIL_PASSWORD: ${{ secrets.TTR_MAIL_PASSWORD }}
          TTR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          TTR_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
      - name: Записать журнал
        if: always()
        run: |
          git config user.name "miskhub-ttr"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ttr/journal.json
          if git diff --cached --quiet; then
            echo "журнал без изменений"
            exit 0
          fi
          git commit -m "ttr: журнал отправки"
          git push
