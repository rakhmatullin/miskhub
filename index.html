<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>MiskHub</title></head>
<body>
<script>
(async () => {
  const n = 4;
  let html = '';
  for (let i = 0; i < n; i++) {
    const r = await fetch('./parts/index-' + i + '.txt');
    html += await r.text();
  }
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="color:#f87171;padding:20px">Load error: ' + e + '</pre>';
});
</script>
<p style="font-family:system-ui;color:#94a3b8;padding:20px">Загрузка MiskHub…</p>
</body></html>
