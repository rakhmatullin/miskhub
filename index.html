<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiskHub</title>
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Инструменты инженера ПТО: устранение замечаний, сверка весов, граф знаний." />
    <link rel="icon" type="image/svg+xml" href="/miskhub/assets/favicon-DBfTAH7Q.svg" />
    <script type="module" crossorigin src="/miskhub/assets/main-B0uSOz_s.js"></script>
    <link rel="modulepreload" crossorigin href="/miskhub/assets/app-spxHeBi4.js">
    <link rel="modulepreload" crossorigin href="/miskhub/assets/preload-helper-8vhTeOtO.js">
    <link rel="stylesheet" crossorigin href="/miskhub/assets/app-DuK--N2i.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function inject() {
          var header = document.querySelector("header");
          if (!header || header.querySelector("[data-akty]")) return !!header && !!header.querySelector("[data-akty]");
          var links = header.querySelectorAll("a");
          if (!links.length) return false;
          var a = document.createElement("a");
          a.setAttribute("data-akty", "1");
          a.href = "/miskhub/akty.html";
          a.textContent = "Акты об устранении";
          a.className = links[links.length - 1].className;
          links[1] ? links[1].after(a) : links[0].after(a);
          return true;
        }
        var n = 0;
        var t = setInterval(function () {
          if (inject() || ++n > 50) clearInterval(t);
        }, 80);
      })();
    </script>
  </body>
</html>
