<style>
  #graph-version {
    position: fixed; top: 12px; right: 16px; z-index: 200;
    font-size: 12px; color: #8ea0c0; opacity: 0.8;
  }
</style>
<div id="graph-version">Версия 1.4</div>

    <script src="/miskhub/hub-nav.js?v=9"></script>
  



<style>
  #hover-popup {
    position: fixed; z-index: 100; pointer-events: none;
    background: linear-gradient(135deg, rgba(10,20,40,0.95), rgba(20,40,70,0.9));
    border: 1px solid rgba(96,165,250,0.5);
    border-radius: 12px; padding: 12px 16px;
    box-shadow: 0 0 20px rgba(96,165,250,0.4), inset 0 0 10px rgba(96,165,250,0.1);
    backdrop-filter: blur(8px);
    color: #e8eef6; font-size: 13px; max-width: 260px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
  }
  #hover-popup.show { opacity: 1; transform: translateY(0); }
  #hover-popup .name { font-weight: 600; color: #60a5fa; margin-bottom: 4px; }
  #hover-popup .desc { color: #a0b4cc; font-size: 12px; line-height: 1.4; }
  #hover-ring {
    position: fixed; z-index: 99; pointer-events: none;
    border: 2px solid rgba(96,165,250,0.7);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(96,165,250,0.6), inset 0 0 8px rgba(96,165,250,0.2);
    opacity: 0; transition: opacity 0.15s;
  }
  #hover-ring.show { opacity: 1; }
</style>
<div id="hover-popup"></div>
<div id="hover-ring"></div>
<script>
(function(){
  const popup = document.getElementById("hover-popup");
  const ring = document.getElementById("hover-ring");
  let hideTimer;
  window.addEventListener("graphhover", function(e) {
    clearTimeout(hideTimer);
    const d = e.detail;
    if (!d || !d.node) {
      hideTimer = setTimeout(() => { popup.classList.remove("show"); ring.classList.remove("show"); }, 80);
      return;
    }
    const node = d.node;
    popup.innerHTML = '<div class="name">' + node.name + '</div><div class="desc">' + (node.desc || "") + '</div>';
    popup.style.left = (d.x + 40) + "px";
    popup.style.top = (d.y - 20) + "px";
    popup.classList.add("show");
    ring.style.left = (d.x - 28) + "px";
    ring.style.top = (d.y - 28) + "px";
    ring.style.width = "56px";
    ring.style.height = "56px";
    ring.classList.add("show");
  });
})();
</script>
</body>
</html>
