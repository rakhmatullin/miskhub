<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiskHub</title>
    <link rel="apple-touch-icon" href="/miskhub/assets/favicon.svg?v=6">
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Инструменты инженера ПТО: сборка актов, сверка весов, ежедневный акт ТТР." />
    <link rel="icon" type="image/svg+xml" href="/miskhub/assets/favicon.svg?v=6" />
    <script type="module" crossorigin src="/miskhub/assets/main-B0uSOz_s.js?v=7"></script>
    <link rel="modulepreload" crossorigin href="/miskhub/assets/app-spxHeBi4.js?v=6">
    <link rel="modulepreload" crossorigin href="/miskhub/assets/preload-helper-8vhTeOtO.js?v=6">
    <link rel="stylesheet" crossorigin href="/miskhub/assets/app-DuK--N2i.css?v=6">
  </head>
  <body>
    <div id="root"></div>
    <script src="/miskhub/hub-nav.js?v=9"></script>
  
<style>
  #hover-popup {
    position: fixed; z-index: 100; pointer-events: none;
    background: linear-gradient(135deg, rgba(10,20,40,0.95), rgba(20,40,70,0.9));
    border: 1px solid rgba(125,211,252,0.4);
    border-radius: 12px; padding: 12px 16px;
    box-shadow: 0 0 20px rgba(125,211,252,0.3), inset 0 0 10px rgba(125,211,252,0.1);
    backdrop-filter: blur(8px);
    color: #e8eef6; font-size: 13px; max-width: 260px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
  }
  #hover-popup.show { opacity: 1; transform: translateY(0); }
  #hover-popup .name { font-weight: 600; color: #7dd3fc; margin-bottom: 4px; }
  #hover-popup .desc { color: #a0b4cc; font-size: 12px; line-height: 1.4; }
  #hover-ring {
    position: fixed; z-index: 99; pointer-events: none;
    border: 2px solid rgba(125,211,252,0.6);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(125,211,252,0.5), inset 0 0 8px rgba(125,211,252,0.2);
    opacity: 0; transition: opacity 0.15s;
  }
  #hover-ring.show { opacity: 1; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 20% 80%, rgba(125,211,252,0.03), transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(167,139,250,0.03), transparent 50%);
  }
</style>
<div id="hover-popup"></div>
<div id="hover-ring"></div>
<script>
(function(){
  const popup = document.getElementById("hover-popup");
  const ring = document.getElementById("hover-ring");
  let hideTimer;
  window.addEventListener("graphhover", function(e) {
    clearTimeout(hideTimer);
    const node = e.detail;
    if (!node) {
      hideTimer = setTimeout(() => { popup.classList.remove("show"); ring.classList.remove("show"); }, 100);
      return;
    }
    popup.innerHTML = '<div class="name">' + node.name + '</div><div class="desc">' + (node.desc || "") + '</div>';
    popup.style.left = (window.event?.clientX || 100) + 16 + "px";
    popup.style.top = (window.event?.clientY || 100) - 10 + "px";
    popup.classList.add("show");
    ring.style.left = ((window.event?.clientX || 100) - 30) + "px";
    ring.style.top = ((window.event?.clientY || 100) - 30) + "px";
    ring.style.width = "60px";
    ring.style.height = "60px";
    ring.classList.add("show");
  });
  document.addEventListener("mousemove", function(ev) {
    if (popup.classList.contains("show")) {
      popup.style.left = (ev.clientX + 16) + "px";
      popup.style.top = (ev.clientY - 10) + "px";
      ring.style.left = (ev.clientX - 30) + "px";
      ring.style.top = (ev.clientY - 30) + "px";
    }
  });
})();
</script>
</body>
</html>
